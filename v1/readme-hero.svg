<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Veilbox Linux version 1</title>
  <desc id="desc">An animated kernel boot pulse moving through a compact stack from Linux to containers.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090D10"/>
      <stop offset=".52" stop-color="#10191B"/>
      <stop offset="1" stop-color="#111716"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1=".5" x2="1" y2=".5">
      <stop stop-color="#F3B65B" stop-opacity="0"/>
      <stop offset=".38" stop-color="#F3B65B"/>
      <stop offset=".7" stop-color="#5CE1C6"/>
      <stop offset="1" stop-color="#5CE1C6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD17B"/>
      <stop offset="1" stop-color="#D88B31"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#B7D5CF" stroke-opacity=".032"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".62"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <style>
    .display { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .bootline { animation: boot 6s ease-in-out infinite; }
    .packet { animation: packet 4.8s cubic-bezier(.4,0,.2,1) infinite; }
    .packet-b { animation-delay: -2.4s; }
    .layer-1 { animation: wake 4.8s ease-in-out infinite; }
    .layer-2 { animation: wake 4.8s ease-in-out -.8s infinite; }
    .layer-3 { animation: wake 4.8s ease-in-out -1.6s infinite; }
    .layer-4 { animation: wake 4.8s ease-in-out -2.4s infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .status { animation: status 3s ease-in-out infinite; }
    @keyframes boot {
      0%, 100% { stroke-dashoffset: 620; opacity: .18; }
      45%, 68% { stroke-dashoffset: 0; opacity: .9; }
    }
    @keyframes packet {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 1; }
      78% { opacity: 1; }
      100% { transform: translateY(205px); opacity: 0; }
    }
    @keyframes wake {
      0%, 100% { stroke-opacity: .18; }
      45%, 62% { stroke-opacity: .75; }
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes status { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .bootline, .packet, .layer-1, .layer-2, .layer-3, .layer-4, .cursor, .status { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#scan)"/>
    <ellipse cx="887" cy="222" rx="320" ry="230" fill="#1D8A7A" fill-opacity=".1" filter="url(#soft)"/>

    <g class="display">
      <g transform="translate(72 65)">
        <path d="M0 15h8l7-12 10 24 8-12h18" fill="none" stroke="url(#amber)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="65" y="20" fill="#C8D8D4" font-size="12" font-weight="650" letter-spacing="2">VEILBOX / GEN 01</text>
      </g>

      <text x="72" y="164" fill="#F1F5F2" font-size="58" font-weight="720" letter-spacing="-2.1">The whole system.</text>
      <text x="72" y="222" fill="url(#amber)" font-size="58" font-weight="720" letter-spacing="-2.1">Nothing hidden.</text>
      <text x="75" y="265" fill="#9EB1AD" font-size="17">Kernel to container runtime, assembled from source.</text>

      <g class="mono" transform="translate(73 308)">
        <rect width="438" height="55" rx="10" fill="#070A0C" stroke="#78958F" stroke-opacity=".28"/>
        <text x="18" y="22" fill="#738C87" font-size="10">[    2.041337 ]</text>
        <text x="112" y="22" fill="#5CE1C6" font-size="10">veilbox:</text>
        <text x="170" y="22" fill="#D2DDD9" font-size="10">containerd ready</text>
        <text x="18" y="42" fill="#F3B65B" font-size="11">root@veilbox:~#</text>
        <rect class="cursor" x="123" y="32" width="7" height="12" fill="#F3B65B"/>
        <g class="status">
          <circle cx="402" cy="20" r="4" fill="#5CE1C6"/>
          <text x="414" y="23" fill="#78958F" font-size="8">UP</text>
        </g>
      </g>
    </g>

    <g filter="url(#shadow)">
      <path class="bootline" d="M572 209H666l17-35 24 70 23-45 24 10h355" fill="none" stroke="url(#pulse)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="620"/>

      <g transform="translate(741 63)">
        <path d="M38 0v205" stroke="#5CE1C6" stroke-opacity=".18" stroke-dasharray="3 8"/>
        <g class="packet">
          <circle cx="38" cy="0" r="5" fill="#F3B65B"/>
          <circle cx="38" cy="0" r="11" fill="none" stroke="#F3B65B" stroke-opacity=".35"/>
        </g>
        <g class="packet packet-b">
          <circle cx="38" cy="0" r="4" fill="#5CE1C6"/>
        </g>
      </g>

      <g class="mono">
        <g class="layer-1">
          <rect x="684" y="72" width="380" height="58" rx="12" fill="#141C1D" stroke="#F3B65B" stroke-opacity=".32"/>
          <rect x="702" y="89" width="24" height="24" rx="6" fill="#F3B65B" fill-opacity=".12"/>
          <text x="714" y="106" text-anchor="middle" fill="#F3B65B" font-size="12">01</text>
          <text x="746" y="98" fill="#E2EAE7" font-size="11">LINUX KERNEL</text>
          <text x="746" y="115" fill="#708782" font-size="9">custom config · embedded initramfs</text>
          <text x="1038" y="106" text-anchor="end" fill="#AFC0BC" font-size="9">7.1-rc6</text>
        </g>

        <g class="layer-2">
          <rect x="704" y="139" width="380" height="58" rx="12" fill="#121B1B" stroke="#D5B269" stroke-opacity=".28"/>
          <rect x="722" y="156" width="24" height="24" rx="6" fill="#D5B269" fill-opacity=".1"/>
          <text x="734" y="173" text-anchor="middle" fill="#E7BF6B" font-size="12">02</text>
          <text x="766" y="165" fill="#E2EAE7" font-size="11">BUSYBOX USERSPACE</text>
          <text x="766" y="182" fill="#708782" font-size="9">small surface · fast boot</text>
          <text x="1058" y="173" text-anchor="end" fill="#AFC0BC" font-size="9">INIT</text>
        </g>

        <g class="layer-3">
          <rect x="724" y="206" width="380" height="58" rx="12" fill="#101B1B" stroke="#75C8B7" stroke-opacity=".28"/>
          <rect x="742" y="223" width="24" height="24" rx="6" fill="#5CE1C6" fill-opacity=".1"/>
          <text x="754" y="240" text-anchor="middle" fill="#5CE1C6" font-size="12">03</text>
          <text x="786" y="232" fill="#E2EAE7" font-size="11">CONTAINERD + CNI</text>
          <text x="786" y="249" fill="#708782" font-size="9">isolated workloads · bridge networking</text>
          <text x="1078" y="240" text-anchor="end" fill="#AFC0BC" font-size="9">READY</text>
        </g>

        <g class="layer-4">
          <rect x="744" y="273" width="380" height="58" rx="12" fill="#0F1919" stroke="#5CE1C6" stroke-opacity=".26"/>
          <rect x="762" y="290" width="24" height="24" rx="6" fill="#5CE1C6" fill-opacity=".09"/>
          <text x="774" y="307" text-anchor="middle" fill="#5CE1C6" font-size="12">04</text>
          <text x="806" y="299" fill="#E2EAE7" font-size="11">DROPBEAR + STATE</text>
          <text x="806" y="316" fill="#708782" font-size="9">remote access · persistent disk</text>
          <text x="1098" y="307" text-anchor="end" fill="#AFC0BC" font-size="9">ONLINE</text>
        </g>
      </g>
    </g>

    <g class="mono" fill="#50645F" font-size="8" letter-spacing="1.2">
      <text x="685" y="359">BOOT PATH / 4 LAYERS</text>
      <text x="1123" y="359" text-anchor="end">UNDER 15 SECONDS</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="27.25" fill="none" stroke="#78958F" stroke-opacity=".24" stroke-width="1.5"/>
</svg>
