name: Build ISO

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'branding/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:trixie-slim
      options: --privileged

    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq live-build git curl ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure live-build
        run: ./auto/config

      - name: Build ISO
        run: |
          lb build 2>&1 | tee build.log

      - name: Copy ISO
        run: |
          mkdir -p output
          cp live-image-amd64.hybrid.iso output/veilbox-2.0-amd64.iso 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: veilbox-iso
          path: output/veilbox-2.0-amd64.iso
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Upload ISO to Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install gh from official repo for large file (>2GB) chunked upload support
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq && apt-get install -y -qq gh
          RELEASE_TAG="v2.0.0"
          if gh release view "$RELEASE_TAG" --repo Shreyas0047/veilbox &>/dev/null; then
            echo "Uploading to release $RELEASE_TAG..."
            gh release upload "$RELEASE_TAG" output/veilbox-2.0-amd64.iso --repo Shreyas0047/veilbox --clobber
          else
            echo "Release $RELEASE_TAG not found, creating..."
            gh release create "$RELEASE_TAG" output/veilbox-2.0-amd64.iso --repo Shreyas0047/veilbox --title "$RELEASE_TAG" --generate-notes
          fi