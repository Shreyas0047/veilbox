# {{.DisplayName}} — Veilbox-generated Noctalia shell configuration.
# Created by 'veil desktop install {{.Name}}' on first touch.
# Veilbox-managed settings live in
# ~/.config/veilbox/desktop/{{.Name}}/noctalia-veilbox.toml and are
# regenerated by 'veil desktop provision {{.Name}}'. You can add your
# own settings below this block — your values win over the include.

[include]
files = ["~/.config/veilbox/desktop/{{.Name}}/noctalia-veilbox.toml"]
