name: devops
display_name: DevOps Engineer
description: >-
  Builds and operates delivery pipelines: source control, CI/CD,
  deployment automation, and infrastructure as code. Needs solid
  terminal and networking foundations to diagnose failures quickly.
role: devops
recommended_capabilities:
  - networking
  - terminal-operations
optional_capabilities:
  - observability
  - containers
tags:
  - ci
  - delivery
  - operations
workspace_preferences:
  shell: bash
  editor: vim
  terminal: system
  prompt: veilbox
  tmux: true
  aliases:
    k: kubectl
    tf: terraform
  environment:
    KUBECONFIG: ~/.kube/config
