name: cloud-engineer
display_name: Cloud Engineer
description: >-
  Works with cloud infrastructure and remote systems: network paths,
  connectivity, and deployment boundaries. Networking and a solid base
  come first; a comfortable terminal is a common extra.
role: cloud-engineer
recommended_capabilities:
  - networking
optional_capabilities:
  - terminal-operations
tags:
  - cloud
  - connectivity
  - infrastructure
workspace_preferences:
  shell: bash
  editor: vim
  terminal: system
  prompt: veilbox
  tmux: false
  aliases:
    k: kubectl
  environment:
    AWS_REGION: us-east-1
