name: sre
display_name: Site Reliability Engineer
description: >-
  Keeps systems reliable: monitoring, incident response, and
  performance analysis. Observability tooling comes first, followed by
  network and container diagnostics; cluster administration for the
  systems under watch.
role: sre
recommended_capabilities:
  - networking
  - observability
  - containers
  - kubernetes
optional_capabilities:
  - security
  - terminal-operations
tags:
  - reliability
  - monitoring
  - incidents
workspace_preferences:
  shell: bash
  editor: vim
  terminal: system
  prompt: plain
  tmux: false
  aliases:
    ll: ls -la
