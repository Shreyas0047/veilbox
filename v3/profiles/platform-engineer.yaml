name: platform-engineer
display_name: Platform Engineer
description: >-
  Designs and runs the internal platform: shared infrastructure,
  tooling, and self-service foundations. Deep terminal and automation
  fluency; networking diagnostics on demand. Observability tooling may
  be added manually when needed.
role: platform-engineer
recommended_capabilities:
  - terminal-operations
  - containers
  - kubernetes
optional_capabilities:
  - networking
  - observability
tags:
  - platform
  - tooling
  - automation
workspace_preferences:
  shell: bash
  editor: vim
  terminal: system
  prompt: veilbox
  tmux: true
  aliases:
    kg: kubectl get
