name: niri-desktop
display_name: Niri Experience
type: environment
description: >-
  Complete Niri + Noctalia desktop environment: scrollable-tiling
  Wayland compositor with an integrated shell (bar, dock, launcher,
  notifications, lock screen, idle handling, wallpaper, clipboard,
  screenshots, OSDs) and a sensible default keybinding set, ready at
  first login. The first reference bundled environment (ADR-0012,
  ADR-0015).
rpm: veilbox-experience-niri
components:
  compositor: niri
  desktop_shell: noctalia
  terminal: kitty
  launcher: builtin
  notifications: builtin
  lock: builtin
  idle: builtin
  wallpaper: builtin
  clipboard: builtin
  screenshot: builtin
  display_manager: sddm
environment:
  config:
    - src: niri.config.kdl
      dest: niri/config.kdl
    - src: noctalia.config.toml
      dest: noctalia/config.toml
  managed:
    - src: noctalia-veilbox.toml
      dest: noctalia-veilbox.toml
  validate:
    files:
      - noctalia/config.toml
    commands:
      - [noctalia, config, validate]
packages:
  - niri
  - noctalia
  - kitty
  - xorg-x11-server-Xwayland
  - sddm
  - wl-clipboard
  - grim
  - slurp
