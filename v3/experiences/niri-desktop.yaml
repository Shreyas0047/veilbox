name: niri-desktop
display_name: Niri Experience
type: desktop
description: >-
  Complete Niri + Noctalia desktop experience: scrollable-tiling
  Wayland compositor with an integrated shell (bar, dock, launcher,
  notifications, lock screen, idle handling, wallpaper, clipboard,
  screenshots, OSDs) and a sensible default keybinding set, ready at
  first login.
rpm: veilbox-experience-niri
components:
  compositor: niri
  shell: noctalia
  terminal: kitty
  launcher: builtin
  notifications: builtin
  lock: builtin
  idle: builtin
  wallpaper: builtin
  clipboard: builtin
  screenshot: builtin
  display_manager: sddm
packages:
  - niri
  - noctalia
  - kitty
  - xorg-x11-server-Xwayland
  - sddm
  - wl-clipboard
  - grim
  - slurp
