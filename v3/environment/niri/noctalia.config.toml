# {{.DisplayName}} — Veilbox-generated Noctalia shell configuration.
# Created by 'veil environment install {{.Name}}' on first touch.
# Veilbox-managed settings live in
# ~/.config/veilbox/environment/{{.Name}}/noctalia-veilbox.toml and are
# regenerated by 'veil environment provision {{.Name}}'. You can add
# your own settings below this block — your values win over the
# include.

[include]
files = ["~/.config/veilbox/environment/{{.Name}}/noctalia-veilbox.toml"]
