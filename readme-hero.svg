<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Veilbox Linux</title>
  <desc id="desc">An animated Veilbox workspace showing a live terminal, flowing Niri windows, and a container deployment pipeline.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071016"/>
      <stop offset=".55" stop-color="#0B1720"/>
      <stop offset="1" stop-color="#101927"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D4AA"/>
      <stop offset="1" stop-color="#0088CC"/>
    </linearGradient>
    <linearGradient id="brandFade" x1="0" y1=".5" x2="1" y2=".5">
      <stop stop-color="#00D4AA" stop-opacity="0"/>
      <stop offset=".45" stop-color="#00D4AA" stop-opacity=".8"/>
      <stop offset=".75" stop-color="#36A9E1" stop-opacity=".62"/>
      <stop offset="1" stop-color="#36A9E1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="windowEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D4AA" stop-opacity=".75"/>
      <stop offset=".52" stop-color="#4AA8D8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7E8BC4" stop-opacity=".58"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#00AFC0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00AFC0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B8D8E4" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02080D" flood-opacity=".7"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="24"/>
    </clipPath>
    <clipPath id="terminalBody">
      <rect x="704" y="137" width="294" height="174"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .workspace { animation: workspace-drift 10s ease-in-out infinite alternate; }
    .side-window { animation: side-window 10s ease-in-out infinite alternate; }
    .terminal-window { animation: terminal-window 10s ease-in-out infinite alternate; }
    .pipeline-window { animation: pipeline-window 10s ease-in-out infinite alternate; }
    .prompt-cursor { animation: blink 1.1s steps(1) infinite; }
    .status-dot { animation: breathe 2.8s ease-in-out infinite; }
    .packet-one { animation: packet 4.5s linear infinite; }
    .packet-two { animation: packet 4.5s linear -2.25s infinite; }
    .trace { animation: trace 5.5s ease-in-out infinite; }
    .shield-v { animation: shield-pulse 3.8s ease-in-out infinite; transform-origin: 101px 83px; }

    @keyframes workspace-drift {
      from { transform: translateX(8px); }
      to { transform: translateX(-10px); }
    }
    @keyframes side-window {
      from { transform: translate(0, 3px) rotate(2deg); opacity: .82; }
      to { transform: translate(-8px, -3px) rotate(1deg); opacity: .96; }
    }
    @keyframes terminal-window {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }
    @keyframes pipeline-window {
      from { transform: translate(0, -2px) rotate(-2deg); opacity: .88; }
      to { transform: translate(7px, 4px) rotate(-1deg); opacity: 1; }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes packet {
      0% { transform: translateX(0); opacity: 0; }
      12%, 82% { opacity: 1; }
      100% { transform: translateX(174px); opacity: 0; }
    }
    @keyframes trace {
      0%, 100% { stroke-dashoffset: 420; opacity: .15; }
      45%, 70% { stroke-dashoffset: 0; opacity: .8; }
    }
    @keyframes shield-pulse {
      0%, 100% { opacity: .72; transform: scale(.97); }
      50% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .workspace, .side-window, .terminal-window, .pipeline-window,
      .prompt-cursor, .status-dot, .packet-one, .packet-two, .trace, .shield-v {
        animation: none;
      }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="902" cy="202" rx="390" ry="270" fill="url(#ambient)" filter="url(#blur)"/>
    <path class="trace" d="M505 344C618 306 659 236 757 207S978 158 1188 77" fill="none" stroke="url(#brandFade)" stroke-width="2" stroke-dasharray="420" stroke-linecap="round"/>

    <g class="sans">
      <g transform="translate(72 48)">
        <g class="shield-v">
          <path d="M29 6 4 18v17c0 18 10 31 25 37 15-6 25-19 25-37V18Z" fill="#00D4AA" fill-opacity=".06" stroke="url(#brand)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="m17 34 12 15 12-15M21 24h16" fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="72" y="30" fill="#F1F7F8" font-size="15" font-weight="700">VEILBOX</text>
        <text x="72" y="49" fill="#718995" font-size="10" font-weight="600" letter-spacing="1.6">LINUX / 2.0</text>
      </g>

      <text x="72" y="170" fill="#F3F8F9" font-size="57" font-weight="760">Build. Boot.</text>
      <text x="72" y="228" fill="url(#brand)" font-size="57" font-weight="760">Ship anywhere.</text>
      <text x="75" y="270" fill="#9AB0B9" font-size="17">A container-native Debian workspace, composed for flow.</text>

      <g class="mono" transform="translate(73 307)">
        <rect width="432" height="57" rx="8" fill="#050C11" fill-opacity=".88" stroke="#62808B" stroke-opacity=".3"/>
        <path d="M0 30h432" stroke="#66818A" stroke-opacity=".12"/>
        <circle cx="18" cy="15" r="3" fill="#ED6A5E"/>
        <circle cx="30" cy="15" r="3" fill="#E8C45A"/>
        <circle cx="42" cy="15" r="3" fill="#00D4AA"/>
        <text x="18" y="47" fill="#00D4AA" font-size="11">$</text>
        <text x="34" y="47" fill="#D7E2E5" font-size="11">./docker-build.sh build</text>
        <rect class="prompt-cursor" x="195" y="37" width="7" height="12" rx="1" fill="#00D4AA"/>
        <circle class="status-dot" cx="348" cy="44" r="3" fill="#00D4AA"/>
        <text x="359" y="47" fill="#7E969F" font-size="8" letter-spacing="1.2">ISO READY</text>
      </g>
    </g>

    <g class="workspace" filter="url(#shadow)">
      <ellipse cx="912" cy="205" rx="258" ry="150" fill="none" stroke="#76A8B8" stroke-opacity=".1" stroke-dasharray="4 9"/>

      <g class="side-window">
        <rect x="916" y="54" width="224" height="143" rx="12" fill="#101E28" stroke="#6B96A6" stroke-opacity=".38"/>
        <path d="M916 84h224" stroke="#72909A" stroke-opacity=".2"/>
        <circle cx="936" cy="69" r="3" fill="#00D4AA"/>
        <text class="mono" x="948" y="73" fill="#90A9B1" font-size="8" letter-spacing="1">NIRI / WORKSPACES</text>
        <rect x="934" y="101" width="53" height="72" rx="6" fill="#00D4AA" fill-opacity=".08" stroke="#00D4AA" stroke-opacity=".25"/>
        <rect x="994" y="101" width="78" height="72" rx="6" fill="#289DD2" fill-opacity=".08" stroke="#289DD2" stroke-opacity=".24"/>
        <rect x="1079" y="101" width="43" height="72" rx="6" fill="#8190C6" fill-opacity=".08" stroke="#8190C6" stroke-opacity=".22"/>
        <rect x="944" y="115" width="30" height="4" rx="2" fill="#00D4AA" fill-opacity=".65"/>
        <rect x="1005" y="115" width="44" height="4" rx="2" fill="#4AA8D8" fill-opacity=".65"/>
        <rect x="1089" y="115" width="22" height="4" rx="2" fill="#8C9AC9" fill-opacity=".6"/>
      </g>

      <g class="pipeline-window">
        <rect x="920" y="222" width="239" height="139" rx="12" fill="#0E1B25" stroke="#6C91A1" stroke-opacity=".38"/>
        <path d="M920 251h239" stroke="#72909A" stroke-opacity=".18"/>
        <circle cx="940" cy="237" r="3" fill="#36A9E1"/>
        <text class="mono" x="952" y="240" fill="#8EA6AF" font-size="8" letter-spacing="1">DEPLOYMENT PATH</text>
        <path d="M953 296h173" stroke="#53707B" stroke-width="2" stroke-dasharray="3 6"/>
        <g class="packet-one">
          <circle cx="953" cy="296" r="4" fill="#00D4AA"/>
          <circle cx="953" cy="296" r="8" fill="none" stroke="#00D4AA" stroke-opacity=".28"/>
        </g>
        <g class="packet-two">
          <circle cx="953" cy="296" r="3" fill="#36A9E1"/>
        </g>
        <g class="mono" font-size="7" text-anchor="middle">
          <g transform="translate(953 296)">
            <rect x="-17" y="-17" width="34" height="34" rx="7" fill="#0B161E" stroke="#00D4AA" stroke-opacity=".45"/>
            <text y="3" fill="#D9E6E8">SRC</text>
          </g>
          <g transform="translate(1040 296)">
            <rect x="-17" y="-17" width="34" height="34" rx="7" fill="#0B161E" stroke="#28A8C7" stroke-opacity=".45"/>
            <text y="3" fill="#D9E6E8">IMG</text>
          </g>
          <g transform="translate(1126 296)">
            <rect x="-17" y="-17" width="34" height="34" rx="7" fill="#0B161E" stroke="#36A9E1" stroke-opacity=".45"/>
            <text y="3" fill="#D9E6E8">ISO</text>
          </g>
        </g>
        <text class="mono" x="943" y="337" fill="#66808A" font-size="8">TRIXIE</text>
        <text class="mono" x="1137" y="337" text-anchor="end" fill="#00BFA8" font-size="8">VERIFIED</text>
      </g>

      <g class="terminal-window">
        <rect x="694" y="96" width="314" height="225" rx="14" fill="#081118" stroke="url(#windowEdge)" stroke-width="1.4"/>
        <path d="M694 137h314" stroke="#68838E" stroke-opacity=".24"/>
        <circle cx="716" cy="117" r="4" fill="#ED6A5E"/>
        <circle cx="730" cy="117" r="4" fill="#E8C45A"/>
        <circle cx="744" cy="117" r="4" fill="#00D4AA"/>
        <text class="mono" x="978" y="121" text-anchor="end" fill="#5F7983" font-size="8" letter-spacing="1">VEILBOX@LIVE</text>

        <g clip-path="url(#terminalBody)" class="mono">
          <text x="716" y="164" fill="#00D4AA" font-size="11">$</text>
          <text x="732" y="164" fill="#D8E4E7" font-size="11">systemctl status docker</text>
          <circle class="status-dot" cx="720" cy="187" r="4" fill="#00D4AA"/>
          <text x="733" y="191" fill="#9EB2B9" font-size="10">active (running)</text>
          <text x="716" y="220" fill="#00D4AA" font-size="11">$</text>
          <text x="732" y="220" fill="#D8E4E7" font-size="11">kubectl get nodes</text>
          <text x="716" y="242" fill="#627B85" font-size="9">NAME</text>
          <text x="782" y="242" fill="#627B85" font-size="9">STATUS</text>
          <text x="865" y="242" fill="#627B85" font-size="9">VERSION</text>
          <text x="716" y="260" fill="#B9C9CE" font-size="9">veilbox</text>
          <text x="782" y="260" fill="#00D4AA" font-size="9">Ready</text>
          <text x="865" y="260" fill="#B9C9CE" font-size="9">v1.34</text>
          <text x="716" y="291" fill="#00D4AA" font-size="11">$</text>
          <rect class="prompt-cursor" x="732" y="281" width="7" height="12" rx="1" fill="#00D4AA"/>
        </g>

        <g transform="translate(714 301)">
          <rect width="93" height="4" rx="2" fill="#152A32"/>
          <rect width="71" height="4" rx="2" fill="url(#brand)"/>
          <text class="mono" x="105" y="5" fill="#607983" font-size="7">BOOT 04.8s</text>
        </g>
      </g>
    </g>

    <g class="mono" fill="#536D78" font-size="8" letter-spacing="1.2">
      <text x="73" y="397">DEBIAN TRIXIE / AMD64</text>
      <text x="1127" y="397" text-anchor="end">NIRI + NOCTALIA / CONTAINER NATIVE</text>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="23.25" fill="none" stroke="#76A8B8" stroke-opacity=".22" stroke-width="1.5"/>
</svg>
